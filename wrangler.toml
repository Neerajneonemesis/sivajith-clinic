name = "sivajith-clinic"
main = "worker.js"
compatibility_date = "2026-11-01"
keep_vars = true

[assets]
directory = "./"
binding = "ASSETS"

# Optional: If you want Wrangler to bind D1 automatically from config instead of the Dashboard UI,
# uncomment the 3 lines below and paste your D1 database_id from Cloudflare Dashboard -> D1:
# [[d1_databases]]
# binding = "DB"
# database_name = "sivajith-clinic-db"
# database_id = "PASTE_YOUR_D1_UUID_HERE"
